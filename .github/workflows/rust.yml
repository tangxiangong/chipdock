name: Rust

# Platform-independent checks of the shared Rust Core and release notes. Each platform's bridge
# (UniFFI on macOS, Interoptopus on Windows) is tested by that platform's workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust Core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: Install Linux USB build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Check formatting of every workspace crate
        run: cargo fmt --all -- --check
      - name: Lint Rust Core and release notes
        run: cargo clippy --locked -p chipdock-core -p chipdock-service -p chipdock-release-notes --all-targets -- -D warnings
      - name: Test Rust Core and release note filtering without hardware
        run: cargo test --locked -p chipdock-core -p chipdock-service -p chipdock-release-notes --all-targets
