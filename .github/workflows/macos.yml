name: macOS

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Check shell scripts
        run: |
          for SCRIPT_FILE in bindings/*.sh macos/*.sh macos/ChipDock/Tests/*.sh ci/*.sh; do
            bash -n "$SCRIPT_FILE"
          done
      - name: Lint Rust Core and the UniFFI bridge
        run: cargo clippy --locked -p chipdock-core -p chipdock-service -p chipdock-ffi -p chipdock-bindgen --all-targets -- -D warnings
      - name: Require a checkout without generated bindings
        run: |
          test ! -e bindings/generated/swift/ChipDockCore.swift
          test -z "$(git ls-files bindings/generated)"
      - name: Build native app from the clean checkout
        run: |
          xcodebuild -project macos/ChipDock.xcodeproj -scheme ChipDock \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build/Xcode -clonedSourcePackagesDirPath .build/SourcePackages \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
      - name: Test Rust service and Swift/UniFFI backend without hardware
        run: bash macos/ChipDock/Tests/run-interop-tests.sh
      - name: Test update signature and metadata validation
        run: bash macos/ChipDock/Tests/run-update-tests.sh
      - name: Test serial send and update mirror logic
        run: |
          bash macos/ChipDock/Tests/run-serial-tests.sh
          bash macos/ChipDock/Tests/run-update-mirror-tests.sh
      - name: Verify generated bindings are untracked build outputs
        run: |
          test -s .build/Xcode/Build/Products/ChipDockBindings/Debug/ChipDockCore.swift
          test -s .build/Xcode/Build/Products/ChipDockBindings/Debug/include/ChipDockCoreFFI.h
          test -s .build/Xcode/Build/Products/ChipDockBindings/Debug/include/module.modulemap
          test -s .build/Xcode/Build/Products/ChipDockBindings/Debug/libchipdock_ffi.a
          test -z "$(git ls-files bindings/generated)"
          git check-ignore bindings/generated/swift/ChipDockCore.swift
          git diff --exit-code

  release:
    if: github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')
    needs: validate
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    # Serialize both platforms and COS publication for the ChipDock identity.
    concurrency:
      group: chipdock-updates
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - name: Require update signing key
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_ED_KEY"
          test -n "$COS_SECRET_ID"
          test -n "$COS_SECRET_KEY"
      - name: Verify release tag matches Rust version
        run: |
          CORE_VERSION="$(cargo metadata --format-version 1 --no-deps --locked | \
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "chipdock-core"))')"
          if [[ "$RELEASE_TAG" != "v$CORE_VERSION" ]]; then
            echo "error: Release tag $RELEASE_TAG does not match Rust version v$CORE_VERSION" >&2
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Build universal native app
        run: |
          xcodebuild -project macos/ChipDock.xcodeproj -scheme ChipDock \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath .build/Release -clonedSourcePackagesDirPath .build/SourcePackages \
            ONLY_ACTIVE_ARCH=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Sign, verify and publish Sparkle update
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > .build/ReleaseNotes.md
          ./ci/release-macos.sh --publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES_FILE: .build/ReleaseNotes.md
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
      - name: Mirror verified macOS release to COS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          cargo run --locked -p xtask -- publish-cos --tag "$RELEASE_TAG" --platform macos
