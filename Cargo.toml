[workspace]
members = [
    "crates/chipdock-core",
    "crates/chipdock-service",
    "crates/chipdock-ffi",
    "bindings/generator",
    "crates/chipdock-csharp",
    "bindings/csharp-generator",
    "crates/chipdock-release-notes",
    "xtask",
]
default-members = ["crates/chipdock-core"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["tangxiangong <tangxiangong@gmail.com>"]

[workspace.dependencies]
uniffi = "=0.32.2"
interoptopus = "0.16"
interoptopus_csharp = "0.16"
chipdock-core = { path = "crates/chipdock-core" }
chipdock-service = { path = "crates/chipdock-service" }
chipdock-ffi = { path = "crates/chipdock-ffi" }
chipdock-csharp = { path = "crates/chipdock-csharp" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
