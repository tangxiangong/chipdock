[workspace]
members = [
    "crates/flashdesk-core",
    "crates/flashdesk-bindgen",
    "crates/flashdesk-csharp",
    "crates/flashdesk-csharp-bindgen",
    "crates/flashdesk-release-notes",
]
default-members = ["crates/flashdesk-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["tangxiangong <tangxiangong@gmail.com>"]

[workspace.dependencies]
uniffi = "=0.32.2"
interoptopus = "0.16"
interoptopus_csharp = "0.16"
flashdesk-core = { path = "crates/flashdesk-core" }
flashdesk-csharp = { path = "crates/flashdesk-csharp" }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
