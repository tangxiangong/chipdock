[workspace]
members = [
    "crates/chipdock-core",
    "crates/chipdock-bindgen",
    "crates/chipdock-csharp",
    "crates/chipdock-csharp-bindgen",
    "crates/chipdock-release-notes",
]
default-members = ["crates/chipdock-core"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["tangxiangong <tangxiangong@gmail.com>"]

[workspace.dependencies]
uniffi = "=0.32.2"
interoptopus = "0.16"
interoptopus_csharp = "0.16"
chipdock-core = { path = "crates/chipdock-core" }
chipdock-csharp = { path = "crates/chipdock-csharp" }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
