[package]
name = "chipdock-nsh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chipdock-core.workspace = true
chipdock-gpui-update.workspace = true
chipdock-service.workspace = true
chrono.workspace = true
nsh-core.workspace = true
nsh-base.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
url.workspace = true

[[bin]]
name = "ChipDock"
path = "src/main.rs"

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(windows)'.dependencies]
nsh-platform-windows.workspace = true
uuid.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
tokio.workspace = true
dispatch2.workspace = true
nsh-platform-macos.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-uniform-type-identifiers.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true
