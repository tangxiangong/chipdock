[package]
name = "chipdock-core"
description = "Firmware, probe and storage services for the native ChipDock app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
ihex = "3.0"
interoptopus = { workspace = true, optional = true }
object = "0.40"
nusb = "0.2"
probe-rs = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile.workspace = true
uniffi.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

[features]
# Interoptopus type metadata for the Windows C# bindings.
csharp = ["dep:interoptopus"]
