[package]
name = "chipdock-core"
description = "Firmware, serial, probe and storage services for the native ChipDock app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
encoding_rs.workspace = true
esp-idf-part.workspace = true
ihex.workspace = true
interoptopus = { workspace = true, optional = true }
nusb.workspace = true
object.workspace = true
probe-rs.workspace = true
probe-rs-espressif.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-serial.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Devices_Communication"] }

[features]
# Interoptopus type metadata for the Windows C# bindings.
csharp = ["dep:interoptopus"]
