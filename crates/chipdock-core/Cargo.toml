[package]
name = "chipdock-core"
description = "Firmware, serial, probe and storage services for the native ChipDock app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
encoding_rs = "0.8"
tokio.workspace = true
tokio-serial = "5.4"
# Match probe-rs USB interface metadata when serialport features are unified.
serialport = { version = "4.9", default-features = false, features = ["usbportinfo-interface"] }
chrono.workspace = true
ihex = "3.0"
interoptopus = { workspace = true, optional = true }
object = "0.40"
nusb = "0.2"
probe-rs = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tempfile.workspace = true
uuid.workspace = true

[features]
# Interoptopus type metadata for the Windows C# bindings.
csharp = ["dep:interoptopus"]
