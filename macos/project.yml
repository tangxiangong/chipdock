name: ChipDock
options:
  bundleIdPrefix: com.xiaoyu
  deploymentTarget:
    macOS: '14.0'
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  xcodeVersion: '26.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: 1
    SPARKLE_PUBLIC_ED_KEY: 'NgorrvaZPObmbOUEmKbbCvPbPqcD+kcw7E2NRTfxlKI='
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ChipDock:
    productName: ChipDock
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
        product: Sparkle
    sources:
      - path: ChipDock
        excludes: ['Resources', 'Generated']
      - path: ChipDock/Generated/ChipDockCore.swift
      - path: ChipDock/Resources/ChipDock.icon
        type: file
        buildPhase: resources
      - path: ChipDock/Resources/Licenses/Sparkle.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyu.chipdock
        PRODUCT_NAME: ChipDock
        PRODUCT_MODULE_NAME: ChipDock
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ChipDock/Resources/Info.plist
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ChipDock
        HEADER_SEARCH_PATHS: '$(inherited) $(SRCROOT)/ChipDock/Generated'
        SWIFT_INCLUDE_PATHS: '$(inherited) $(SRCROOT)/ChipDock/Generated'
        LIBRARY_SEARCH_PATHS: '$(inherited) $(BUILT_PRODUCTS_DIR)'
        OTHER_LDFLAGS: '$(inherited) -lchipdock_core -framework IOKit -framework CoreFoundation -framework Security -framework SystemConfiguration -liconv -lresolv -lc++'
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
    preBuildScripts:
      - name: Build Rust Core and generate UniFFI bindings
        script: '"${SRCROOT}/../script/build_rust.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - '$(BUILT_PRODUCTS_DIR)/libchipdock_core.a'
  ChipDockTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ChipDockTests]
    dependencies:
      - target: ChipDock
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyu.chipdock.tests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: '$(inherited) $(SRCROOT)/ChipDock/Generated'
        SWIFT_INCLUDE_PATHS: '$(inherited) $(SRCROOT)/ChipDock/Generated'
schemes:
  ChipDock:
    build:
      targets:
        ChipDock: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ChipDockTests]
    archive:
      config: Release
